<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>Huşu — Kalbini namaza hazırla</title>
    <meta name="description" content="Namaz öncesi sure ve duaların anlamlarına doğrudan bak. Arapça ifadeye dokunarak anlamını gör." />
    <script>
      try{var t=JSON.parse(localStorage.getItem('husu:v1:theme')||'null');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
